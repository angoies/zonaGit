<!DOCTYPE html>
<html>
  <head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!--  
    https://www.tutorialesprogramacionya.com/javascriptya/temarios/descripcion.php?inicio=100&cod=109

    -->
    <header class="container bg-info">
      <h1>Ejemplo uso API y fetch</h1>
    </header>

    <div class="container">
      <p>
        <label for="usuario">Usuario</label>
        <input type="number" name="usuario" id="usuario" />
        <button id="busca">Busca usuario</button>
        <button id="lista">Lista todos los usuarios</button>
      </p>
      <div class="row">
        <table class="table table-striped" id="tabla1"></table>
      </div>
    </div>

    <footer class="container bg-info">
      <h2>Footer</h2>
      <script>
        const now = new Date();
        const currentDateTime = now.toLocaleString();
        document.write("<p> Hora: ", currentDateTime, "</p>");
      </script>
    </footer>

    <script src="app.js"></script>
  </body>
